{% extends "sqladmin/base.html" %}
{% block body %}
<div class="d-flex align-items-center justify-content-center vh-100">
  <form class="col-lg-6 col-md-6 card card-md" action="{{ url_for('admin:login') }}" method="POST" autocomplete="off">
    <div class="card-body">
      <h2 class="card-title text-center mb-4">WorkOS operator sign-in</h2>
      <div class="mb-3">
        <label class="form-label" for="access-token">WorkOS access token</label>
        <input id="access-token" name="access_token" type="password" class="form-control{% if error %} is-invalid{% endif %}"
          required autocomplete="off" spellcheck="false">
        {% if error %}<div class="invalid-feedback">{{ error }}</div>{% endif %}
      </div>
      <button type="submit" class="btn btn-primary w-100">Sign in</button>
    </div>
  </form>
</div>
{% endblock %}
