services:
  api:
    build:
      context: "../.."
      dockerfile: app/Dockerfile
    ports:
      - "9000:9000"
    volumes:
      - ./../../app:/app
    env_file:
      - ./../.env
    environment:
      - ENVIRONMENT=${ENVIRONMENT}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
