name: Checks and tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: cortex-school-backend/app
    services:
      postgres:
        image: postgres:16.8
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: cortex_test
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U postgres -d cortex_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - "6379:6379"
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ENVIRONMENT: testing
      POSTGRES_HOST: "127.0.0.1"
      POSTGRES_PORT: "5432"
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ci-only
      POSTGRES_DB: cortex_test
      CELERY_BROKER_URL: redis://127.0.0.1:6379/0
      CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/1
      AI_TEACHER_DRAFT_REDIS_URL: redis://127.0.0.1:6379/2
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt ruff==0.15.0
      - name: Lint Python
        run: python -m ruff check --select F63,F7,F82 .
      - name: Migrate the test database
        run: python -m alembic upgrade head
      - name: Run backend tests
        run: python -m pytest -v
      - name: Run live WorkOS and OpenRouter tests
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        env:
          WORKOS_API_KEY: ${{ secrets.WORKOS_API_KEY }}
          WORKOS_TEST_GUARDIAN_EMAIL: ${{ secrets.WORKOS_TEST_GUARDIAN_EMAIL }}
          WORKOS_TEST_GUARDIAN_PASSWORD: ${{ secrets.WORKOS_TEST_GUARDIAN_PASSWORD }}
          WORKOS_TEST_ORGANIZATION_ID: ${{ vars.WORKOS_TEST_ORGANIZATION_ID }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python -m pytest -v --tb=short tests/live_providers.py

  frontend:
    name: Frontend checks
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: cortex-school-frontend
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Install dependencies
        run: npm ci
      - name: Run frontend tests
        run: npm test
      - name: Check types and build
        run: npm run build
